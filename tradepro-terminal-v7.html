<!DOCTYPE html>
<html lang="en" data-t="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradePro Terminal</title>
<style>
:root{--bg:#eef0f5;--pn:#fff;--bd:#dfe2ea;--tx:#1d2330;--mu:#7a8094;--g:#089981;--r:#d32f2f;--bl:#2962ff;--m:ui-monospace,Consolas,Menlo,monospace}

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:12px/1.4 var(--m);display:grid;grid-template-rows:58px 1fr 26px;height:100vh;overflow:hidden}
button,select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:3px;padding:5px 9px;cursor:pointer}
.up{color:var(--g)}.dn{color:var(--r)}.mu{color:var(--mu)}
.top{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--pn);border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden}
#px{font-size:19px;font-weight:700}.tf{margin-left:auto;display:flex;gap:3px}.tf .on{background:var(--bl);color:#fff;border-color:var(--bl)}

.main{display:grid;grid-template-columns:200px 1fr 300px;min-height:0}
.wl{background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:6px}
.wr{display:flex;justify-content:space-between;padding:7px 8px;border:1px solid transparent;border-radius:4px;cursor:pointer}
.wr:hover{border-color:var(--bd)}.wr.on{border-color:var(--bl)}
.ct{display:grid;grid-template-rows:1fr 250px;min-height:0;min-width:0}
#cw{position:relative;background:var(--pn);border-bottom:1px solid var(--bd);min-height:0}#cv{position:absolute;inset:0;cursor:crosshair}
#boot{position:absolute;inset:0;background:var(--pn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;padding:20px;text-align:center}
#boot .row{display:flex;gap:16px;justify-content:space-between;min-width:360px;border:1px solid var(--bd);padding:4px 10px;border-radius:3px}
.bt{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;min-height:0}
.pn{background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:6px 10px;border-bottom:1px solid var(--bd);color:var(--mu);font-weight:700}
.pb{overflow:auto;flex:1}
.ts,.ob{display:grid;grid-template-columns:62px 1fr 54px 62px;gap:4px;padding:2px 10px;position:relative}
.ob{grid-template-columns:1fr 1fr 1fr}.ts b,.ob b{font-weight:600}.r{text-align:right}
.ob i{position:absolute;top:1px;bottom:1px;right:0;opacity:.16}.ob.a i{background:var(--r)}.ob.b i{background:var(--g)}.ob.w{outline:1px solid #ff9800;outline-offset:-1px}
.ts.big{border-left:2px solid #ff9800}
.fr{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:4px;padding:2px 10px;text-align:right}.fr span:first-child{text-align:left;color:var(--mu)}.fr.poc{background:rgba(255,152,0,.2)}
.sp{text-align:center;padding:4px;background:var(--bg);font-weight:700}
.dr{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd)}.dr b{width:28px;color:var(--mu)}
.dr div{display:flex;gap:3px;flex-wrap:wrap}.dr i{font-style:normal;padding:1px 5px;border-radius:3px;font-size:10px;background:rgba(128,128,128,.12)}
.ft{display:flex;gap:16px;align-items:center;padding:0 12px;background:var(--pn);border-top:1px solid var(--bd);color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden}.ft b{color:var(--tx)}
#tb{position:absolute;top:6px;left:8px;z-index:4;display:flex;gap:4px;align-items:center;flex-wrap:wrap}#tb button,#tb select{padding:3px 8px;font-size:11px}#tb .on{background:var(--bl);color:#fff;border-color:var(--bl)}#tb i{width:1px;height:16px;background:var(--bd);margin:0 3px}
#ap{position:absolute;top:40px;left:8px;z-index:6;background:var(--pn);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;width:300px;max-height:70%;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#ap label{display:block;padding:2px 0;cursor:pointer}#ap input[type=number]{width:130px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:4px}#ap .lg{padding:3px 0;border-top:1px solid var(--bd);font-size:11px}
#toasts{position:absolute;top:44px;right:80px;z-index:6;display:flex;flex-direction:column;gap:6px;max-width:380px}
.toast{background:var(--pn);border:1px solid #ff9800;border-left:4px solid #ff9800;padding:7px 11px;border-radius:3px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:11px}.toast.b{border-left-color:var(--g)}.toast.s{border-left-color:var(--r)}.toast.p{border-color:var(--bl)}
.rk{padding:3px 8px;border-radius:3px;font-weight:700;font-size:11px;background:var(--bd)}.rk.L{background:rgba(8,153,129,.25);color:var(--g)}.rk.M{background:rgba(255,152,0,.25);color:#ff9800}.rk.H{background:rgba(239,83,80,.28);color:var(--r)}
#px{font-size:20px}.top{gap:10px}
.kpi{display:flex;flex-direction:column;line-height:1.2;padding:0 8px;border-left:1px solid var(--bd)}.kpi label{font-size:9px;letter-spacing:.1em;color:var(--mu)}.kpi b{font-size:12px}.kpi.big{border-left:none}
.rs{display:grid;grid-template-rows:1fr 1fr;min-height:0;background:var(--pn);border-left:1px solid var(--bd)}.rs .pn{border-right:none;border-bottom:1px solid var(--bd)}
.wh{display:flex;gap:6px;align-items:center;position:sticky;top:-6px;background:var(--pn);padding:4px 0 6px;z-index:2}.wh input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:4px 6px;font:inherit}
.lg{padding:4px 10px;border-bottom:1px solid var(--bd);font-size:11px;line-height:1.5}.lg.s{border-left:3px solid var(--r)}.lg.b{border-left:3px solid var(--g)}.lg.p{border-left:3px solid var(--bl)}
@media(max-width:1500px){.kpi.opt{display:none}}@media(max-width:1250px){.main{grid-template-columns:170px 1fr 250px}}
</style></head><body>
<header class="top">

</header>

<section class="ct">
<div id="cw"><canvas id="cv"></canvas>
<div id="tb"><button data-m="fp" class="on">Footprint</button><button data-m="candle">Candles</button><button data-m="renko">Renko</button><i></i>
<button id="bHeat" class="on" title="Liquidity heatmap — hover to read liquidity">Heatmap</button><button id="bFlow" class="on" title="Buyer/seller bubbles">Flow</button><button id="bWh" class="on" title="Whale trades (W)">Whales</button><button id="bAbs" class="on" title="Absorption bubbles">Absorb</button><button id="bStk" class="on" title="Stacked imbalance zones">Stacked</button><select id="imr" title="Stacked imbalance sensitivity"><option value="strict">Imb: Strict 3:1</option><option value="normal">Imb: Normal 2:1</option><option value="sens">Imb: Sensitive</option></select>
<select id="wth" title="Whale threshold"><option value="0">Whale: Auto</option><option value="50000">W ≥ $50K</option><option value="100000">W ≥ $100K</option><option value="250000">W ≥ $250K</option><option value="1000000">W ≥ $1M</option></select><i></i>
<select id="tfs" title="Timeframe"></select><i></i><button id="bAuto" class="on" title="Auto-scale price (A)">Auto</button><button id="bLive" title="Jump to live (End / double-click)">⟲ Live</button><button id="zo" title="Zoom out (-)">−</button><button id="zi" title="Zoom in (+)">+</button><button id="bAl">🔔 Alerts</button><span id="risk" class="rk">RISK —</span><button id="bFull">⛶ Full</button></div>
<div id="ap" style="display:none"><b>ALERTS</b> <span class="mu">— shown on chart as “Trade risky hai”</span>
<label><input type="checkbox" data-a="si" checked> Stacked imbalance</label><label><input type="checkbox" data-a="ab" checked> Absorption</label><label><input type="checkbox" data-a="wh" checked> Whale trade</label>
<label><input type="checkbox" data-a="dv" checked> Delta divergence</label><label><input type="checkbox" data-a="lq" checked> Big liquidity wall near price</label>
<label><input type="checkbox" id="aSnd" checked> Sound</label><label><input type="checkbox" id="aNot"> Desktop notification</label>
<div style="margin:8px 0"><input id="apr" type="number" step="any" placeholder="Price alert"> <button id="apAdd">Add</button></div><div id="apl"></div><button id="apTest" style="margin-top:6px">Test alert on chart</button>
</div>
<div id="toasts"></div>
<div id="boot"><div id="bt">Connecting…</div><div id="bl"></div><div id="bh" class="mu" style="max-width:520px;line-height:1.8"></div><button id="br" style="display:none">Retry</button></div></div>
<div class="bt">
<div class="pn"><div class="ph">FOOTPRINT <span id="fpT" class="mu"></span></div><div class="pb" id="fpb"></div></div>
<div class="pn"><div class="ph">DELTA DASHBOARD · cum 60×1m <b id="cum"></b></div><div class="pb" id="dash"></div></div>
<div class="pn"><div class="ph">ALERT FEED</div><div class="pb" id="alg"><div class="mu" style="padding:10px">No alerts yet — press 🔔 Alerts → “Test alert on chart” to preview</div></div></div>
</div></section>
<aside class="rs">
<div class="pn"><div class="ph">ORDER BOOK</div><div class="pb" id="obb"></div></div>
<div class="pn"><div class="ph">TIME &amp; SALES</div><div class="pb" id="tsb"></div></div>
</aside></div>
<footer class="ft"><span>ROUTE <b id="rt">—</b></span><span>MSG/S <b id="rate">0</b></span><span>LAST <b id="last">—</b></span><span>RECONNECTS <b id="rec">0</b></span><span id="lg" style="margin-left:auto"></span></footer>
<script>
'use strict';
/* ===== 1. CONFIG: multiple Binance routes — if one is blocked by ISP/region, the next one is used automatically ===== */
const ROUTES=[
 {n:'Spot',r:'https://api.binance.com/api/v3',w:'wss://stream.binance.com:9443'},
 {n:'Spot:443',r:'https://api1.binance.com/api/v3',w:'wss://stream.binance.com:443'},
 {n:'GCP',r:'https://api-gcp.binance.com/api/v3',w:'wss://stream.binance.com:443'},
 {n:'Spot4',r:'https://api4.binance.com/api/v3',w:'wss://stream.binance.com:9443'},
 {n:'Vision',r:'https://data-api.binance.vision/api/v3',w:'wss://data-stream.binance.vision'},
 {n:'Futures',r:'https://fapi.binance.com/fapi/v1',w:'wss://fstream.binance.com',f:1},
 {n:'Futures2',r:'https://fapi1.binance.com/fapi/v1',w:'wss://fstream.binance.com:443',f:1}];
const TFS=['1m','5m','15m','30m','1h','4h','1d'],TFMS={'1m':6e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'4h':144e5,'1d':864e5};
const WATCH=['BTCUSDT','ETHUSDT','PAXGUSDT','SOLUSDT','BNBUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','AVAXUSDT','DOTUSDT','LINKUSDT','TRXUSDT','LTCUSDT','SUIUSDT','NEARUSDT','PEPEUSDT','ARBUSDT','ATOMUSDT','INJUSDT','UNIUSDT','AAVEUSDT','TONUSDT'];
const S={wf:'',sp:'normal',fl:new Map(),ema:0,heatS:[],hb:0,fb:1,wth:0,mode:'fp',on:{heat:1,flow:1,wh:1,abs:1,stk:1},al:[],aSeen:new Set(),aWarm:0,aOn:{si:1,ab:1,wh:1,dv:1,lq:1},pa:[],imr:3,lastWh:0,errs:{},hov:null,snd:0,sym:'BTCUSDT',tf:'1m',candles:[],fp:new Map(),seen:new Set(),lastId:0,meta:new Map(),tape:[],bub:[],book:null,dl:{},d1:[],wb:{},msgs:0,lastMsg:0,rec:0,px:0,rc:0};
let ri=0,ltok=0,mtok=0,wTry=0,mws=null,wws=null,dirty=1,mouse=null,drag=null;
const FF='ui-monospace,Consolas,Menlo,monospace',DCW={fp:96,candle:14,renko:18},DFO={fp:1,candle:8,renko:5};
const view={cw:96,off:0,w:0,h:0,auto:true,rng:null,H:1,cnt:20};
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ===== 2. FORMAT HELPERS ===== */
const dec=t=>{let d=0;while(Math.abs(t*10**d-Math.round(t*10**d))>1e-9&&d<10)d++;return d};
function M(){const m=S.meta.get(S.sym);if(m)return m;const p=S.px;const t=p>=1000?.1:p>=100?.01:p>=1?.0001:1e-7;return{tick:t,pd:dec(t)}}
const fP=p=>p==null||!isFinite(p)?'—':(+p).toLocaleString('en-US',{minimumFractionDigits:M().pd,maximumFractionDigits:M().pd});
const fW=p=>p>=100?p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):p>=1?p.toFixed(3):p>=.01?p.toFixed(5):p.toFixed(8);
const fc=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':a>=100?n.toFixed(0):a>=1?n.toFixed(2):n.toFixed(3)};
const sg=n=>(n>=0?'+':'-')+fc(Math.abs(n));
const fq=n=>n===0?'0':n>=100?n.toFixed(0):n>=10?n.toFixed(1):n>=1?n.toFixed(2):n.toFixed(3).replace(/^0/,'');
const hm=ms=>new Date(ms).toTimeString().slice(0,8);
function log(m){$('lg').textContent=hm(Date.now())+' '+m;if($('boot').style.display!=='none'&&$('br').style.display==='none')$('bh').textContent=m}
function setRoute(){$('rt').textContent=ROUTES[ri].n}
function setConn(o){$('dot').className=o?'ok':'';$('cs').textContent=o?'LIVE':'CONNECTING'}
/* ===== 3. BOOT OVERLAY ===== */
function showBoot(t){$('boot').style.display='flex';$('bt').textContent=t;$('bl').innerHTML='';$('bh').innerHTML='';$('br').style.display='none'}
function hideBoot(){$('boot').style.display='none'}
function fatal(t,rows,tips){$('bt').textContent=t;$('bl').innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}</span><span class="${r[2]?'up':'dn'}">${r[1]}</span></div>`).join('');$('bh').innerHTML=tips;$('br').style.display='block'}
$('br').onclick=()=>boot();
/* ===== 4. CONNECTIVITY PROBES (REST + WS per route) ===== */
async function probe(rt){const t0=performance.now();try{const c=new AbortController(),to=setTimeout(()=>c.abort(),5000);
 const r=await fetch(rt.r+'/time',{signal:c.signal,cache:'no-store'});clearTimeout(to);if(!r.ok)return{ms:0,note:'HTTP '+r.status};
 const j=await r.json();return j.serverTime?{ms:Math.round(performance.now()-t0)||1,note:'OK'}:{ms:0,note:'bad reply'}}catch(e){return{ms:0,note:'blocked/unreachable'}}}

const probeWS=rt=>new Promise(res=>{let w,d=0;const f=v=>{if(d)return;d=1;clearTimeout(to);try{w.close()}catch(e){}res(v)};const to=setTimeout(()=>f(0),5000);
 try{w=new WebSocket(rt.w+'/ws/btcusdt@trade')}catch(e){return f(0)}w.onopen=()=>f(1);w.onerror=()=>f(0)});
/* ===== 5. REST CLIENT with route failover + backoff ===== */
async function api(path,q={},n=0){
 if(n>=ROUTES.length*2)throw new Error('all routes failed');
 const rt=ROUTES[ri];
 try{const c=new AbortController(),to=setTimeout(()=>c.abort(),15000);
  const r=await fetch(rt.r+path+'?'+new URLSearchParams(q),{signal:c.signal,cache:'no-store'});clearTimeout(to);
  if(r.status===429||r.status===418){await sleep(1500*(n+1));return api(path,q,n+1)}
  if(r.status===400)throw new Error('HTTP 400 '+path);
  if(!r.ok)throw 0;return await r.json()
 }catch(e){if(e&&e.message&&e.message.startsWith('HTTP 400'))throw e;
  S.errs[rt.n]=String(e&&e.message||e||'blocked/HTTP error');log('REST fail on '+rt.n+' → next');ri=(ri+1)%ROUTES.length;setRoute();return api(path,q,n+1)}}
/* ===== 6. DATA MODEL: candles + footprint levels from aggTrades ===== */
const kc=k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],d:2*(+k[9]||0)-(+k[5])});
let AC=null;function beep(b){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=b?800:400;g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.2);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.2)}catch(e){}}
function addTrade(t,live){
 const id=t.a;if(S.seen.has(id))return;S.seen.add(id);
 if(S.seen.size>150000)S.seen=new Set([...S.seen].slice(-50000));
 if(id>S.lastId)S.lastId=id;
 const bt=t.T-t.T%TFMS[S.tf],tick=M().tick;let f=S.fp.get(bt);
 if(!f){f={lv:new Map(),dmax:0,dmin:0,run:0,n:0};S.fp.set(bt,f);if(S.fp.size>400)S.fp.delete(S.fp.keys().next().value)}
 const q=+t.q,p=+t.p,i=Math.round(p/tick),v=f.lv.get(i)||[0,0];
 {const u=p*q;S.ema=S.ema?S.ema*.999+u*.001:u;   // flow/whale buckets: per candle × price zone
  if(u>=1e4){const th=S.wth||Math.max(3e4,15*S.ema),k=bt+'|'+Math.round(p/S.fb);let o=S.fl.get(k);
   if(!o){o={t:bt,p:0,w:0,b:0,s:0,wb:0,ws:0};S.fl.set(k,o);if(S.fl.size>3000)S.fl.delete(S.fl.keys().next().value)}
   o.p=(o.p*o.w+p*u)/(o.w+u);o.w+=u;if(t.m)o.s+=u;else o.b+=u;if(u>=th){if(t.m)o.ws+=u;else o.wb+=u;
    if(live&&Date.now()-S.lastWh>4000){S.lastWh=Date.now();fire('wh','wh|'+t.a,`⚠ Trade risky hai — WHALE ${t.m?'SELL':'BUY'} $${fc(u)} @ ${fP(p)}: big money active, don't trade against it`,'⚠ Trade risky hai: whale '+(t.m?'sell':'buy')+' $'+fc(u),t.m?'s':'b',p,bt)}}}}
 if(t.m){v[0]+=q;f.run-=q}else{v[1]+=q;f.run+=q}   // m=true → seller aggressor (hits bid)
 f.lv.set(i,v);f.n++;if(f.run>f.dmax)f.dmax=f.run;if(f.run<f.dmin)f.dmin=f.run;
 if(live){S.tape.unshift(t);if(S.tape.length>40)S.tape.pop();const usd=p*q;
  if(usd>=10000){S.bub.push({p,usd,s:t.m?'s':'b',born:performance.now()});if(S.bub.length>20)S.bub.shift()}
  if(usd>=1e5)beep(!t.m);
  tsDirty=1}
 dirty=1}
async function backfill(tok,from){ // pull recent aggTrades so past candles get a real footprint
 const start=Date.now()-Math.min(Math.max(TFMS[S.tf]*10,15*6e4),90*6e4);let n=0;
 while(tok===ltok&&n++<80){const q={symbol:S.sym,limit:1000};if(from)q.fromId=from;else q.startTime=start;
  let a;try{a=await api('/aggTrades',q)}catch(e){break}
  if(tok!==ltok||!a.length)break;for(const t of a)addTrade(t,0);from=a[a.length-1].a+1;
  if(a.length<1000||a[a.length-1].T>Date.now()-1500)break}
 log('footprint history loaded')}
async function heal(tok){try{const kl=await api('/klines',{symbol:S.sym,interval:S.tf,limit:300});
 const m=new Map(S.candles.map(c=>[c.t,c]));kl.map(kc).forEach(c=>m.set(c.t,c));
 S.candles=[...m.values()].sort((a,b)=>a.t-b.t).slice(-6000);dirty=1}catch(e){}
 backfill(tok,S.lastId?S.lastId+1:0)}
/* ===== 7. WEBSOCKETS ===== */
function connectMain(){
 const my=++mtok;try{mws&&(mws.onclose=null,mws.close())}catch(e){}
 const s=S.sym.toLowerCase(),rt=ROUTES[ri];
 const st=[s+'@aggTrade',s+'@depth20@100ms',s+'@ticker',...TFS.map(t=>s+'@kline_'+t)].join('/');
 setConn(0);log('WS dial '+rt.n);let ws;
 try{ws=new WebSocket(rt.w+'/stream?streams='+st)}catch(e){return retry(my)}

  {const ii=Math.floor((mouse.x-x0)/cw),tt=vis[ii]?vis[ii].t:(mode!=='renko'&&vis.length?vis[vis.length-1].t+(ii-vis.length+1)*TFMS[S.tf]:0);

  if(S.on.heat&&mode!=='renko'&&S.heatS.length&&mouse.x<pr){const pm=hi-(mouse.y-top)/H*(hi-lo),tm=vis[0].t+(mouse.x-x0)/cw*TFMS[S.tf];let sn=S.heatS[S.heatS.length-1],bd=1e18;

   const kk=Math.floor(pm/sn.hb)-sn.b0,u=kk>=0&&kk<sn.v.length?sn.v[kk]:0,sd=pm<sn.m?'BID':'ASK',L1=fP(pm)+'  ·  '+sd,

   const bw2=Math.max(x.measureText(L1).width,x.measureText(L2).width)+16,bx2=Math.min(mouse.x+14,w-AX-bw2-4),by=Math.max(top+4,mouse.y-46);

}
